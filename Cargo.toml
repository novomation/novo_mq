[package]
name = "novomq"
version = "0.5.1"
edition = "2024"
rust-version = "1.88"
authors = ["Marc Fischer <marc.fischer@novomation.de>"]
description = "Simple real-time messaging "
license = "MIT OR Apache-2.0"
repository = "https://github.com/novomation/novo_mq"
homepage = "https://github.com/novomation/novo_mq"
keywords = ["ipc", "linux", "rt", "real-time"]
categories = ["network-programming"]


[dependencies]
base64 = "0.23"
heapless = "0.9"
log = "0.4"
thiserror = "2.0"
uuid = { version = "1", features = ["v4"] }
waitfree-sync = "0.4"
rtsan-standalone = { version = "0.3.0", optional = true }
rt_tunex = { version = "0.6.0" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["socket", "fs", "uio"] }


[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
] }

[dev-dependencies]
test-log = "0.2"
plotly = "0.14"
simple_logger = "5.2"
dhat = { version = "0.3.3" }

[features]
rtsan = ["rtsan-standalone"]
dhat-heap = []


[[bench]]
name = "realtime"
harness = false

[[bench]]
name = "long_term"
harness = false
