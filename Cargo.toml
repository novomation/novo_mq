[package]
name = "novomq"
version = "0.3.0"
edition = "2024"
rust-version = "1.87"
authors = ["Marc Fischer <marc.fischer@novomation.de>"]
description = "Simple real-time messaging "
license = "MIT OR Apache-2.0"
repository = "https://github.com/novomation/novo_mq"
homepage = "https://github.com/novomation/novo_mq"
keywords = ["ipc", "linux", "rt", "real-time"]
categories = ["network-programming"]


[dependencies]
base64 = "0.22"
heapless = "0.9"
log = "0.4"
nix = { version = "0.31", features = ["socket", "fs", "uio"] }
thiserror = "2.0"
uuid = { version = "1", features = ["v4"] }
waitfree-sync = "0.3"
linux-rt = { version = "0.3.2", git = "https://github.com/marcfir/linux-rt", tag = "v0.3.2" }
rtsan-standalone = { version = "0.3.0", optional = true }

[dev-dependencies]
test-log = "0.2"
linux-rt = { version = "0.3.2", git = "https://github.com/marcfir/linux-rt", tag = "v0.3.2" }
plotly = "0.14"
simple_logger = "5.2"

[features]
rtsan = ["rtsan-standalone"]


[[bench]]
name = "realtime"
harness = false

[[bench]]
name = "long_term"
harness = false
