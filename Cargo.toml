[package]
name = "rt-datalayer"
version = "0.1.0"
edition = "2024"
authors = ["Marc Fischer <marcfir@proton.me>"]
description = "Real-time datalyer for IPC"
keywords = ["ipc", "linux", "rt", "real-time"]


[dependencies]
base64 = "0.22.1"
heapless = "0.9.2"
log = "0.4.29"
nix = { version = "0.30.1", features = ["socket", "fs"] }
thiserror = "2.0.17"
uuid = { version = "1.19.0", features = ["v4"] }
waitfree-sync = "0.3.2"

[dev-dependencies]
test-log = "0.2.19"
linux-rt = { version = "0.3.2", git = "https://github.com/marcfir/linux-rt", tag = "v0.3.2" }
plotly = "0.13.5"
simple_logger = "5.1.0"


[[bench]]
name = "realtime"
harness = false
