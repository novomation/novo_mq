[package]
name = "rt-datalayer"
version = "0.2.0"
edition = "2024"
authors = ["Marc Fischer <marcfir@proton.me>"]
description = "Real-time datalyer for IPC"
keywords = ["ipc", "linux", "rt", "real-time"]


[dependencies]
base64 = "0.22.1"
heapless = "0.9.2"
log = "0.4"
nix = { version = "0.31.2", features = ["socket", "fs", "uio"] }
thiserror = "2.0.18"
uuid = { version = "1.22.0", features = ["v4"] }
waitfree-sync = "0.3.2"
linux-rt = { version = "0.3.2", git = "https://github.com/marcfir/linux-rt", tag = "v0.3.2" }
rtsan-standalone = { version = "0.3.0", optional = true }

[dev-dependencies]
test-log = "0.2.19"
linux-rt = { version = "0.3.2", git = "https://github.com/marcfir/linux-rt", tag = "v0.3.2" }
plotly = "0.14.1"
simple_logger = "5.2.0"

[features]
rtsan = ["rtsan-standalone"]


[[bench]]
name = "realtime"
harness = false

[[bench]]
name = "long_term"
harness = false
