[package]
name = "novomq"
version = "0.5.0"
edition = "2024"
rust-version = "1.87"
authors = ["Marc Fischer <marc.fischer@novomation.de>"]
description = "Simple real-time messaging "
license = "MIT OR Apache-2.0"
repository = "https://github.com/novomation/novo_mq"
homepage = "https://github.com/novomation/novo_mq"
keywords = ["ipc", "linux", "rt", "real-time"]
categories = ["network-programming"]


[dependencies]
base64 = "0.22"
heapless = "0.9"
log = "0.4"
thiserror = "2.0"
uuid = { version = "1", features = ["v4"] }
waitfree-sync = "0.3"
rtsan-standalone = { version = "0.3.0", optional = true }
rt_tunex = { path = "../rt_tunex" }
crossbeam-utils = "0.8.22"
memmap2 = "0.9.11"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["socket", "fs", "uio", "event"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Memory",
] }

[dev-dependencies]
test-log = "0.2"
plotly = "0.14"
simple_logger = "5.2"
dhat = { version = "0.3.3" }
zerocopy = { version = "0.8", features = ["derive"] }

[features]
rtsan = ["rtsan-standalone"]
dhat-heap = []


[[bench]]
name = "realtime"
harness = false

[[bench]]
name = "long_term"
harness = false

[[bench]]
name = "long_term_tb"
harness = false

[[bench]]
name = "mem_test"
harness = false
